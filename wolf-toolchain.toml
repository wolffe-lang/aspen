# aspen — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build (lope's and boreutils' shape).
# `tools/fetch-toolchain` downloads the archive for this host, refuses
# on a digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored): the native tier needs `libwolf_rt.a` beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# ## The first pin: wolf 0.2.33 / lupin 0.1.55 / wolf-std e036bec (ap00, 2026-10-21)
#
# `gh release list -R wolffe-lang/wolf-lang` at the start: v0.2.33 is the
# latest, so 0.2.33 is pinned. Digests read twice from the release API
# (wolf-lang release 417610226, wolf-interp release 418932753), equal
# both times, and the linux x86-64 pair hashed twice after download on
# kasumi. The tag objects: v0.2.33 `56110e4f` -> `85dab5d7`, v0.1.55
# `047184fb` -> `e642f263`.
#
# wolf 0.2.33's `--version` line 2 names lupin 0.1.54 as its pairing;
# the contract pins lupin 0.1.55 (released 2026-10-20), the reference
# interpreter wolf-std `e036bec` vendors (`df04a7a`), so the pair is
# std's, not the driver's. The wolf archive bundles wolf-std `cceda63`
# (`std/STD-REV`); `tools/fetch-toolchain` stages the std pin below in
# its place and says so.
#
# ## The bump: wolf 0.2.34, lupin and wolf-std unchanged (ap01, 2026-10-21)
#
# `gh release list -R wolffe-lang/wolf-lang` at ap01's start: v0.2.34 is
# the latest (2026-10-21), and it brings `fs_realpath`, which
# `--hyperlink` needs (C aspen's realpath, `src/render/unix.c:231`).
# Digests read twice from the release API (release 419552903), equal
# both times, and the linux x86-64 archive hashed twice after download on
# kasumi. The tag object: v0.2.34 `38ab81cb` -> `9da7bdcf`. Its
# `--version` line 2 names lupin 0.1.55 as its pairing, the pin below,
# and its archive bundles wolf-std `e036bec`, the std pin below: the
# driver, the interpreter and the std agree for the first time.
#
# Windows is not pinned: aspen lists POSIX directory trees.

[wolf]
version = "0.2.34"
repo = "wolffe-lang/wolf-lang"
rev = "9da7bdcf2aea9adf48df6570bedc58e16e9ef853"
version_line = "wolf 0.2.34 (wolfgang, pin 9da7bdc)"
aarch64-apple-darwin = "29c8331f5d188b00c4580bc7677b1238891c5734d00b0512df10c60eab236ee3"
x86_64-unknown-linux-gnu = "88a9dd3da1c9a0e38c08eb6e2de9c1ef04d1ed93dcf51024d8dbbb76890c1821"
aarch64-unknown-linux-gnu = "ca5cadf936dc0d4396e92733fc65e953d549f3b61f0aa354e7be2e78ea8c3ad0"

[lupin]
