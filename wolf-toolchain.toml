version_line = "lupin 0.1.55 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "2eac1cccdc8a5bec5831787604098982a7ac42e41561a037c3b5ccf0ac21741a"
x86_64-unknown-linux-gnu = "1152abc0bef65d334b94bc881a26463fac345919cc2ca07a291796e6048a8a38"
aarch64-unknown-linux-gnu = "5854ab268a835bb75749bce7601441858ac342351906a0838e8602e4edbd45d7"

